name: Monitor Marketplace

on:
  schedule:
    # a cada 10 minutos (o GitHub pode atrasar alguns minutos em horários de pico)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # botão "Run workflow" para rodar na hora

permissions:
  contents: write         # para salvar o estado.json no repositório

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          GREENAPI_ID: ${{ secrets.GREENAPI_ID }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          GREENAPI_DESTINO: ${{ secrets.GREENAPI_DESTINO }}
          GREENAPI_URL: ${{ secrets.GREENAPI_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: python monitor.py

      - name: Salvar estado
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add estado.json
          git diff --staged --quiet || (git commit -m "estado: $(date -u +%FT%TZ)" && git push)
